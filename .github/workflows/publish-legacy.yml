name: Build and publish legacy Multi Emoji

on:
  push:
    branches:
      - compat/vendetta-multi-emoji
    paths:
      - 'legacy/Multi Emoji/**'
      - 'scripts/build-legacy.mjs'
      - '.github/workflows/publish-legacy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-legacy-multi-emoji
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install legacy bundler
        run: |
          npm install --no-save --no-package-lock rollup@^3 @rollup/plugin-commonjs@^24 @rollup/plugin-node-resolve@^15 @swc/core@^1.3 rollup-plugin-esbuild@^5 esbuild@^0.16
      - name: Bundle plugin
        run: node scripts/build-legacy.mjs
      - name: Publish to GitHub Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/pages
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          mkdir -p /tmp/pages/legacy/Multi-Emoji
          cp dist/Multi-Emoji/index.js dist/Multi-Emoji/manifest.json /tmp/pages/legacy/Multi-Emoji/
          touch /tmp/pages/.nojekyll
          git -C /tmp/pages add legacy/Multi-Emoji/index.js legacy/Multi-Emoji/manifest.json .nojekyll
          if git -C /tmp/pages diff --cached --quiet; then
            echo "Published files are already up to date."
            exit 0
          fi
          git -C /tmp/pages commit -m "Publish legacy Multi Emoji plugin"
          git -C /tmp/pages push origin gh-pages
