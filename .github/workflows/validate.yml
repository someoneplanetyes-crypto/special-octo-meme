# PR build validation

name: Validate

on:
  workflow_dispatch:

  pull_request_target:
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'cli/**'
      - '.github/**'
      - 'repo.config.json'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR security acknowledgment
        run: |
          if [ "${{ vars.ACKNOWLEDGE_PR_SECURITY_WARNING }}" != "true" ]; then
            echo "::error::You have not acknowledged the security warning for this workflow."
            echo "This workflow uses pull_request_target and requires your explicit acknowledgment."
            echo "Go to Settings > Actions > General and require approval for external contributors."
            echo "Then set ACKNOWLEDGE_PR_SECURITY_WARNING=true under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins
        env:
          GITHUB_TOKEN: ${{ secrets.READ_PACKAGES_TOKEN }}

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://revenge.local \
            --out /tmp/index.json
          cat /tmp/index.json
